apply plugin: 'com.android.application'

android {
    namespace "com.termux.api"
    buildFeatures {
        buildConfig true
        aidl true
    }

    compileSdk project.properties.compileSdkVersion.toInteger()
    compileSdkMinor project.properties.compileSdkMinorVersion.toInteger()
    ndkVersion project.properties.ndkVersion
    def buildProfile = providers.gradleProperty('termuxBuildProfile').getOrElse('pixel11')
    if (!(buildProfile in ['pixel11', 'all'])) {
        throw new GradleException("termuxBuildProfile must be pixel11 or all")
    }
    def appVersionName = System.getenv("TERMUX_API_APP__BUILD__APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_API_APP__BUILD__APK_VERSION_TAG") ?: ""

    defaultConfig {
        applicationId "com.termux.api"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 1002
        versionName "0.53.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Termux"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        ndk {
            abiFilters.addAll(buildProfile == 'pixel11' ? ['arm64-v8a'] :
                    ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'])
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("termux-api-app_" +
                    (apkVersionTag ? apkVersionTag : "v" + versionName + "+" + variant.buildType.name) + ".apk")
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
        // Remove terminal-emulator and termux-shared JNI libs added via termux-shared dependency
        exclude "lib/*/libtermux.so"
        exclude "lib/*/liblocal-socket.so"
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"

    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.preference:preference:1.2.1"

    implementation "com.termux.termux-app:termux-shared:8aca6dbbf4"
    // Use if below libraries are published locally by termux-app with `./gradlew publishReleasePublicationToMavenLocal` and used with `mavenLocal()`.
    // If updates are done, republish there and sync project with gradle files here
    // https://github.com/termux/termux-app/wiki/Termux-Libraries
    //implementation "com.termux:termux-shared:0.118.0"

    implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"

    testImplementation 'junit:junit:4.13.2'
    // Pure JSON/model tests; device/framework calls are validated on the Pixel.
    testImplementation 'org.json:json:20240303'
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

@SuppressWarnings("UnnecessaryQualifiedReference")
static def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '" + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

// Package a PIE executable as a native library so Android installs it on executable
// storage. This is a separate helper, not a library loaded into the app process.
def vmLauncherOutput = layout.buildDirectory.dir("generated/vmLauncher/jniLibs")
android.sourceSets.main.jniLibs.srcDir(vmLauncherOutput)
tasks.register("buildVmLauncher") {
    inputs.file("src/main/cpp/vm-launcher.c")
    outputs.dir(vmLauncherOutput)
    doLast {
        def host = org.gradle.internal.os.OperatingSystem.current()
        def hostTag = host.isMacOsX() ? "darwin-x86_64" : host.isWindows() ? "windows-x86_64" : "linux-x86_64"
        def triples = ["arm64-v8a": "aarch64-linux-android", "armeabi-v7a": "armv7a-linux-androideabi",
                       "x86": "i686-linux-android", "x86_64": "x86_64-linux-android"]
        android.defaultConfig.ndk.abiFilters.each { abi ->
            def destination = new File(vmLauncherOutput.get().asFile, abi)
            destination.mkdirs()
            def compiler = new File(android.sdkDirectory,
                    "ndk/${android.ndkVersion}/toolchains/llvm/prebuilt/${hostTag}/bin/${triples[abi]}26-clang" + (host.isWindows() ? ".cmd" : ""))
            providers.exec {
                commandLine compiler, "-Wall", "-Wextra", "-Werror", "-O2", "-fPIE", "-pie",
                        "-Wl,-z,max-page-size=16384", file("src/main/cpp/vm-launcher.c"),
                        "-o", new File(destination, "libtermux-vm-launcher.so")
            }.result.get().assertNormalExitValue()
        }
    }
}
tasks.named("preBuild").configure { dependsOn("buildVmLauncher") }
