name: Arch AVF guest
on:
  push:
    branches: ['dev', 'wallentx/**']
    paths: ['guest/arch/build.sh', 'guest/arch/init', 'guest/arch/kernel.config', 'guest/arch/sshd_config', 'guest/arch/vsock-ssh.c', 'guest/arch/boot_test.py', 'guest/arch/network', 'guest/arch/dhcp-hook', 'guest/arch/dhcp_hook_test.py', 'guest/arch/landlock-check.c', 'guest/arch/shutdown.c', 'guest/arch/vsock-net.c', 'guest/arch/network-host/**', '.github/workflows/arch-guest.yml']
  pull_request:
    branches: [master, dev]
    paths: ['guest/arch/build.sh', 'guest/arch/init', 'guest/arch/kernel.config', 'guest/arch/sshd_config', 'guest/arch/vsock-ssh.c', 'guest/arch/boot_test.py', 'guest/arch/network', 'guest/arch/dhcp-hook', 'guest/arch/dhcp_hook_test.py', 'guest/arch/landlock-check.c', 'guest/arch/shutdown.c', 'guest/arch/vsock-net.c', 'guest/arch/network-host/**', '.github/workflows/arch-guest.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arch-guest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guest:
    # dev and wallentx branches already run these tests on push.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.head_ref != 'dev' && !startsWith(github.head_ref, 'wallentx/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test DHCP resolver failover
        run: python3 guest/arch/dhcp_hook_test.py
      - name: Install guest build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev libelf-dev libarchive-tools e2fsprogs zstd qemu-system-arm openssh-client
      - name: Restore guest kernel
        id: kernel
        uses: actions/cache/restore@v4
        with:
          path: |
            guest-out/Image
            guest-out/kernel.config
          key: arch-kernel-v2-${{ hashFiles('guest/arch/kernel.config', 'guest/arch/build.sh') }}
      - name: Build guest kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: bash guest/arch/build.sh kernel
      - name: Save guest kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            guest-out/Image
            guest-out/kernel.config
          key: ${{ steps.kernel.outputs.cache-primary-key }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: guest/arch/network-host/go.sum
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Build and test network backend in CI
        run: |
          sdkmanager 'ndk;29.0.14206865'
          mkdir -p guest-out
          cd guest/arch/network-host
          go test ./...
          go build -trimpath -o "$RUNNER_TEMP/arch-network-host-linux" .
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64
          export CC="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          go build -trimpath -buildmode=pie -ldflags='-s -w' -o "$GITHUB_WORKSPACE/guest-out/arch-network-host" .
          python3 licenses.py > "$GITHUB_WORKSPACE/guest-out/network-host-LICENSES.txt"
      - name: Build and boot networked Arch guest
        run: bash guest/arch/build.sh rootfs
      - uses: actions/upload-artifact@v4
        with:
          name: arch-avf-${{ github.sha }}
          path: guest-out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed boot log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arch-avf-failure
          path: guest-out/ci-console.txt
          if-no-files-found: ignore
